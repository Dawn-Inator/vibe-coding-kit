<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Task Progress</title>
    <style>
      :root {
        color-scheme: light dark;
        --ctp-surface: var(--color-background-primary, Canvas);
        --ctp-text: var(--color-text-primary, CanvasText);
        --ctp-muted: var(--color-text-secondary, GrayText);
        --ctp-border: var(--color-border-primary, color-mix(in srgb, currentColor 18%, transparent));
        --ctp-hover: color-mix(in srgb, currentColor 8%, transparent);
      }
      *, *::before, *::after { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; background: transparent; }
      body { color: var(--ctp-text); font-family: var(--font-sans, system-ui, sans-serif); }
      #native-panel-shell {
        min-height: 100dvh;
        padding: max(12px, var(--safe-top, env(safe-area-inset-top, 0px)))
          max(12px, var(--safe-right, env(safe-area-inset-right, 0px)))
          max(12px, var(--safe-bottom, env(safe-area-inset-bottom, 0px)))
          max(12px, var(--safe-left, env(safe-area-inset-left, 0px)));
      }
      #native-panel-error {
        margin: 0 0 8px;
        border: 1px solid var(--ctp-border);
        border-radius: 8px;
        padding: 8px 10px;
        color: var(--color-text-danger, #a33333);
        font-size: 12px;
        overflow-wrap: anywhere;
      }
      #native-panel-retry {
        margin: 0 0 8px;
        border: 1px solid var(--ctp-border);
        border-radius: 8px;
        padding: 6px 10px;
        color: var(--ctp-text);
        background: var(--ctp-surface);
        font: inherit;
        cursor: pointer;
      }
      #native-panel-error[hidden], #native-panel-retry[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main id="native-panel-shell" aria-label="Task progress">
      <div id="native-panel-error" role="alert" aria-live="assertive" hidden></div>
      <button id="native-panel-retry" type="button" hidden>Retry</button>
    </main>
    <!-- NATIVE_PANEL_SCRIPT -->
  </body>
</html>
