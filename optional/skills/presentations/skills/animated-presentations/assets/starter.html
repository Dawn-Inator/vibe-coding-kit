<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Presentation</title>
<!-- Inline this stylesheet in a single-file deliverable. -->
<link rel="stylesheet" href="../viewport-base.css">
<style>
* { box-sizing: border-box; }
:root { --slide-bg: #faf8f2; --stage-bg: #181818; --ink: #202020; --accent: #ad3e24; }
body { font-family: Georgia, serif; color: var(--ink); }
.slide { padding: 100px; }
h1, h2 { font-size: 100px; max-width: 1550px; margin: 0 0 48px; }
p { font-size: 40px; line-height: 1.5; max-width: 1450px; }
.reveal { opacity: 0; transform: translateY(24px); transition: opacity .4s, transform .4s; }
.visible .reveal { opacity: 1; transform: none; }
.deck-controls { display: flex; gap: 12px; align-items: center; padding: 8px; background: #fff; color: #202020; border-radius: 8px; font: 16px sans-serif; }
button { font: inherit; padding: 8px 16px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--accent); }
html.export-mode .deck-controls { display: none; }
html.export-mode .reveal { opacity: 1; transform: none; transition: none; }
@media (prefers-reduced-motion: reduce) {
  .reveal { opacity: 1; transform: none; transition: none; }
}
</style>
</head>
<body>
<div class="deck-viewport">
<main class="deck-stage" id="deckStage" aria-label="Presentation">
  <section class="slide active visible" aria-labelledby="title-one">
    <h1 id="title-one" class="reveal">Presentation title</h1>
    <p class="reveal">Replace this text with your opening idea.</p>
  </section>
  <section class="slide" aria-labelledby="title-two" aria-hidden="true" inert>
    <h2 id="title-two" class="reveal">One clear idea</h2>
    <p class="reveal">Expand the selected visual system across your actual content.</p>
  </section>
</main>
</div>
<nav class="deck-controls" aria-label="Slide navigation" tabindex="-1">
  <button id="previous" type="button" aria-label="Previous slide">←</button>
  <output id="progress" aria-live="polite"></output>
  <button id="next" type="button" aria-label="Next slide">→</button>
</nav>
<script>
/* Stage dimensions: update together with CSS when changing aspect ratio. */
const stage = document.getElementById('deckStage');
const slides = [...document.querySelectorAll('.slide')];
const previous = document.getElementById('previous');
const next = document.getElementById('next');
let current = 0;
function scaleStage() {
  const scale = Math.min(innerWidth / 1920, innerHeight / 1080);
  stage.style.transform = `translate(${(innerWidth - 1920 * scale) / 2}px, ${(innerHeight - 1080 * scale) / 2}px) scale(${scale})`;
}
function showSlide(index) {
  current = Math.max(0, Math.min(index, slides.length - 1));
  if (slides.some((slide, i) => i !== current && slide.contains(document.activeElement))) document.querySelector('.deck-controls').focus();
  slides.forEach((slide, i) => {
    const active = i === current;
    slide.classList.toggle('active', active);
    slide.classList.toggle('visible', active);
    slide.inert = !active;
    slide.setAttribute('aria-hidden', String(!active));
  });
  document.getElementById('progress').textContent = `${current + 1} / ${slides.length}`;
  previous.disabled = current === 0;
  next.disabled = current === slides.length - 1;
}
previous.addEventListener('click', () => showSlide(current - 1));
next.addEventListener('click', () => showSlide(current + 1));
document.addEventListener('keydown', event => {
  if (event.altKey || event.ctrlKey || event.metaKey || event.target.closest('input,textarea,select,button,a,[contenteditable]')) return;
  if (['ArrowRight', 'PageDown', ' '].includes(event.key)) { event.preventDefault(); showSlide(current + 1); }
  if (['ArrowLeft', 'PageUp'].includes(event.key)) { event.preventDefault(); showSlide(current - 1); }
  if (event.key === 'Home') { event.preventDefault(); showSlide(0); }
  if (event.key === 'End') { event.preventDefault(); showSlide(slides.length - 1); }
});
/* Export contract: final reveal state, deterministic slide selection, no overlays. */
window.renderSlide = async (index, { exportMode = false } = {}) => {
  document.documentElement.classList.toggle('export-mode', exportMode);
  showSlide(index);
  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  if (exportMode) document.getAnimations().forEach(animation => animation.cancel());
};
addEventListener('resize', scaleStage);
scaleStage();
showSlide(0);
</script>
</body>
</html>
