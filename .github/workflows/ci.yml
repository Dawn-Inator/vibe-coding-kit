name: CI

on:
  push:
    branches:
      - main
      - 'candidate/**'
  pull_request:
    branches:
      - main
      - 'candidate/**'

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 20
          - 22
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Record runner versions
        shell: bash
        run: |
          git --version
          node --version
          node -p 'process.platform + " " + process.arch'

      - name: Run the exact test manifest
        shell: bash
        run: node tests/run.mjs
