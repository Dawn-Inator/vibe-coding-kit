name: CI

on:
  push:
    branches:
      - main
      - 'candidate/**'
  pull_request:
    branches:
      - main
      - 'candidate/**'

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 20
          - 22
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Record runner versions
        shell: bash
        run: |
          git --version
          node --version
          node -p 'process.platform + " " + process.arch'

      - name: Install locked analyzer test dependencies
        run: npm ci --ignore-scripts

      - name: Record backend analyzer toolchains
        shell: bash
        run: |
          python3 --version
          go version

      - name: Run the exact test manifest
        shell: bash
        run: node tests/run.mjs

      - name: Pack CLI and smoke the installed command
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          output_file="$RUNNER_TEMP/vibe-coding-kit-help.txt"
          version="$(node -p "require('./package.json').version")"
          mkdir -p "$RUNNER_TEMP/neutral-cli"
          cd "$RUNNER_TEMP/neutral-cli"
          npm exec --offline --yes --cache "$RUNNER_TEMP/npm-cache" --package="$RUNNER_TEMP/vibe-coding-kit-$version.tgz" -- vibe-coding-kit help | tee "$output_file"
          grep -q 'vibe-coding-kit install' "$output_file"
