name: Windows system diagnostic

# Windows-only checks the cross-platform CI matrix cannot cover: native process
# safety, Git hook environment, packaged installer and CLI process-tree cleanup.
# The full test manifest on Windows already runs in ci.yml.
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'cli.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: windows-system-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-process-safety:
    name: Windows / Node 22 / native process safety
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Record runner versions
        shell: bash
        run: |
          git --version
          node --version
          node -p 'process.platform + " " + process.arch'

      - name: Prove live CWD and ACL denial behavior
        shell: bash
        run: node tests/run-windows-native-proof.mjs

  git-hook-context:
    name: Windows / Node ${{ matrix.node }} / Git hook context
    needs: native-process-safety
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Record runner versions
        shell: bash
        run: |
          git --version
          node --version
          node -p 'process.platform + " " + process.arch'

      - name: Run fixed Git hook context regressions
        shell: bash
        run: node --test tests/contracts/project-adapter.test.mjs tests/worktrees/git-environment-boundary.test.mjs

  packaged-installer:
    name: Windows / Node ${{ matrix.node }} / packaged installer
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Record runner versions
        shell: bash
        run: |
          git --version
          node --version
          node -p 'process.platform + " " + process.arch'

      - name: Run fixed installer regressions
        shell: bash
        run: node --test tests/install/command.test.mjs tests/install/init.test.mjs tests/install/bootstrap.test.mjs

      - name: Pack CLI and smoke the installed command
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          output_file="$RUNNER_TEMP/vibe-coding-kit-help.txt"
          version="$(node -p "require('./package.json').version")"
          mkdir -p "$RUNNER_TEMP/neutral-cli"
          cd "$RUNNER_TEMP/neutral-cli"
          npm exec --offline --yes --cache "$RUNNER_TEMP/npm-cache" --package="$RUNNER_TEMP/vibe-coding-kit-$version.tgz" -- vibe-coding-kit help | tee "$output_file"
          grep -q 'vibe-coding-kit install' "$output_file"

  cli-process-tree:
    name: Windows / Node ${{ matrix.node }} / CLI process-tree safety
    needs: native-process-safety
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Record runner versions
        shell: bash
        run: |
          git --version
          node --version
          node -p 'process.platform + " " + process.arch'

      - name: Run the fixed CLI transport proof
        shell: bash
        run: node tests/run-windows-transport-proof.mjs
