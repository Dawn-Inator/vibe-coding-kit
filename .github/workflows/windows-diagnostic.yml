name: Windows diagnostic

on:
  push:
    branches:
      - 'diagnostic/windows-**'

permissions:
  contents: read

jobs:
  windows-native-proof:
    name: Windows / Node 22 / native process safety
    if: startsWith(github.ref, 'refs/heads/diagnostic/windows-') && !startsWith(github.ref, 'refs/heads/diagnostic/windows-installer-')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Record runner versions
        shell: bash
        run: |
          git --version
          node --version
          node -p 'process.platform + " " + process.arch'

      - name: Prove live CWD and ACL denial behavior
        shell: bash
        run: node tests/run-windows-native-proof.mjs

  windows-hook-context:
    name: Windows / Node ${{ matrix.node }} / Git hook context
    if: startsWith(github.ref, 'refs/heads/diagnostic/windows-hook-context-')
    needs: windows-native-proof
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Record runner versions
        shell: bash
        run: |
          git --version
          node --version
          node -p 'process.platform + " " + process.arch'

      - name: Run fixed Git hook context regressions
        shell: bash
        run: node --test tests/contracts/project-adapter.test.mjs tests/worktrees/git-environment-boundary.test.mjs

  windows-installer-proof:
    name: Windows / Node ${{ matrix.node }} / packaged installer
    if: startsWith(github.ref, 'refs/heads/diagnostic/windows-installer-')
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Record runner versions
        shell: bash
        run: |
          git --version
          node --version
          node -p 'process.platform + " " + process.arch'

      - name: Run fixed installer regressions
        shell: bash
        run: node --test tests/install/command.test.mjs tests/install/init.test.mjs tests/install/bootstrap.test.mjs

      - name: Pack CLI and smoke the installed command
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          output_file="$RUNNER_TEMP/vibe-coding-kit-help.txt"
          version="$(node -p "require('./package.json').version")"
          mkdir -p "$RUNNER_TEMP/neutral-cli"
          cd "$RUNNER_TEMP/neutral-cli"
          npm exec --offline --yes --cache "$RUNNER_TEMP/npm-cache" --package="$RUNNER_TEMP/vibe-coding-kit-$version.tgz" -- vibe-coding-kit help | tee "$output_file"
          grep -q 'vibe-coding-kit install' "$output_file"

  windows-transport-proof:
    name: Windows / Node ${{ matrix.node }} / CLI process-tree safety
    if: startsWith(github.ref, 'refs/heads/diagnostic/windows-transport-')
    needs: windows-native-proof
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      - name: Record runner versions
        shell: bash
        run: |
          git --version
          node --version
          node -p 'process.platform + " " + process.arch'

      - name: Run the fixed CLI transport proof
        shell: bash
        run: node tests/run-windows-transport-proof.mjs

  windows-diagnostic:
    name: Windows / Node 22 / group ${{ matrix.group }}
    if: ${{ !startsWith(github.ref, 'refs/heads/diagnostic/windows-native-') && !startsWith(github.ref, 'refs/heads/diagnostic/windows-hook-context-') && !startsWith(github.ref, 'refs/heads/diagnostic/windows-transport-') && !startsWith(github.ref, 'refs/heads/diagnostic/windows-installer-') }}
    needs: windows-native-proof
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: ['1', '2', '3']
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Record runner versions
        shell: bash
        run: |
          git --version
          node --version
          node -p 'process.platform + " " + process.arch'

      - name: Run the fixed manifest group
        shell: bash
        run: node tests/run-windows-diagnostic.mjs "${{ matrix.group }}"
